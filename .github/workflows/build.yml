name: SonarCloud Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # مطلوبة عشان SonarCloud يقرأ تاريخ التعديلات بدقة

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # مطلوب لتسهيل التحليل
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # التوكن السري الخاص بمشروعك
